name: Ingesta PurpleAir (automática + manual)

# Historia (ver README.md → "Historia de la ingesta automática" para el
# detalle completo): esto corría con schedule cada 15 min, se sacó en
# agosto 2026 al migrar la ingesta a un Cron Trigger de Cloudflare
# (worker/wrangler.toml, worker/src/index.js), y se volvió a activar días
# después porque ese Cron Trigger quedó registrado pero nunca disparó
# scheduled() (parece un bug del lado de Cloudflare, no de este repo).
#
# Pausado de nuevo (septiembre 2026): con el Cron Trigger de Cloudflare sin
# disparar y este `schedule:` + cron-job.org corriendo en paralelo, cada
# ciclo de ~15 min terminaba pegándole 2 veces completas a la API de
# PurpleAir (duplica el gasto de puntos — el INSERT OR IGNORE evita filas
# duplicadas en D1, pero no evita el gasto en PurpleAir). Se deja
# cron-job.org como único camino activo (servicio de cron dedicado, sin el
# problema de delays bajo carga compartida que sí tiene GitHub Actions —
# ver "Historia" en README). Si cron-job.org falla o el consumo de puntos
# deja de ser un problema, se puede reactivar descomentando el `schedule:`
# de abajo. workflow_dispatch se mantiene para backfill puntual a mano.
on:
  # schedule:
  #   - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python ingest_purpleair.py
        env:
          PURPLEAIR_API_KEY: ${{ secrets.PURPLEAIR_API_KEY }}
          SENSOR_INDEXES: ${{ secrets.SENSOR_INDEXES }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
