name = "purpleair-saladillo-api"
main = "src/index.js"
compatibility_date = "2026-08-19"

# Dominio público limpio, sumado como Route (no Custom Domain) para que
# conviva en la misma zona lemeit.ar con las rutas de emas y wq cuando se
# sumen (api.lemeit.ar/emas/*, api.lemeit.ar/wq/*). El *.workers.dev de
# arriba sigue funcionando igual, sin el prefijo /aq — no hay corte.
routes = [
  { pattern = "api.lemeit.ar/aq/*", zone_name = "lemeit.ar" }
]
# Wrangler apaga el *.workers.dev por defecto en cuanto hay "routes" en el
# archivo, a menos que se lo pida explícito acá — sin esta línea el deploy
# de arriba corta el *.workers.dev existente pese al comentario de que no
# lo hace.
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "purpleair-saladillo"
database_id = "9ced8d5e-e3ae-4718-a553-21e349368e1c"
[vars]
AIRGRADIENT_LOCATION_IDS = "72663,71029"

[triggers]
# Sin cron del Worker: PurpleAir se consulta desde cron-job.org a :27/:57.
# Mantener el array vacío evita recrear la programación histórica al desplegar.
# AirGradient queda sin ingesta automática; revisarla antes de reconectarlo.
# Decisión y reversión: docs/VERIFICACION_CONSUMO_PURPLEAIR_20261101.md
crons = []
